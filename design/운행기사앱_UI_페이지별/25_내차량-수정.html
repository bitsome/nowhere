<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>내 차량 수정</title>
<style>
:root{--bg:#0B0F0E;--surface:#141918;--surface2:#1B211F;--border:#262E2B;--border2:#313A36;--primary:#36CDB0;--text:#F3F6F5;--text2:#B7C2BF;--text3:#7C8886;--warning:#F2A93B;--danger:#E95B5B;--info:#4D8FE8}
*{box-sizing:border-box}html{background:#05070A}body{margin:0;background:#05070A;color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px}.phone{width:min(100%,390px);margin:auto;background:var(--bg);border:1px solid var(--border);border-radius:32px;padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.status{display:flex;justify-content:space-between;font-size:12px;padding:3px 5px 12px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.title{font-size:20px;font-weight:900;letter-spacing:-.04em}.back{font-size:24px;color:var(--text2)}.save{font-size:11px;font-weight:900;color:var(--primary)}.section{font-size:12px;font-weight:900;margin:15px 0 8px}.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:13px;margin-bottom:11px}.vehicle-photo{height:142px;border-radius:13px;background:linear-gradient(135deg,#1D2824,#0E1412);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.vehicle-photo:before{content:"STARIA";font-size:40px;font-weight:950;letter-spacing:.08em;color:rgba(54,205,176,.1)}.photo-label{position:absolute;right:10px;bottom:10px;padding:6px 9px;background:rgba(5,7,10,.65);border:1px solid rgba(255,255,255,.08);border-radius:9px;font-size:9.5px;color:var(--text2)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field.full{grid-column:1/-1}.label{display:block;font-size:10px;color:var(--text2);margin-bottom:6px}.input{height:42px;display:flex;align-items:center;padding:0 11px;border-radius:11px;border:1px solid var(--border2);background:var(--surface2);font-size:11.5px;color:var(--text)}.input.muted{color:var(--text3)}.select:after{content:"⌄";margin-left:auto;color:var(--text3);font-size:14px}.verified{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:11px}.verified:last-child{border-bottom:0}.ok{font-size:10px;font-weight:900;color:var(--primary);padding:4px 8px;border-radius:8px;background:rgba(54,205,176,.14)}.notice{padding:10px;border-radius:11px;background:rgba(77,143,232,.1);color:#9FC5FF;font-size:10px;line-height:1.5}.btn{height:48px;border-radius:13px;background:var(--primary);color:#04140F;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:13px;margin-top:10px}.btn.outline{background:transparent;color:var(--text);border:1px solid var(--border2)}
</style>
</head><body><div class="phone">
<div class="status"><span>9:41</span><span>●●● 100%</span></div>
<div class="nav"><div class="back">‹</div><div class="title">내 차량 수정</div><div class="save">저장</div></div>
<div class="card"><div class="vehicle-photo"><div class="photo-label">차량 사진 변경</div></div></div>
<div class="section">차량 기본정보</div><div class="card"><div class="fields">
<div class="field full"><span class="label">차량명</span><div class="input">스타리아</div></div>
<div class="field"><span class="label">차량번호</span><div class="input">123가 4567</div></div>
<div class="field"><span class="label">연식</span><div class="input select">2024년</div></div>
<div class="field"><span class="label">차량 종류</span><div class="input select">승합</div></div>
<div class="field"><span class="label">승차 정원</span><div class="input select">9인승</div></div>
</div></div>
<div class="section">차량 운영정보</div><div class="card">
<div class="verified"><span>보험 만료일</span><span>2026.12.31</span></div>
<div class="verified"><span>정기 검사일</span><span>2027.03.12</span></div>
<div class="verified"><span>차량 인증</span><span class="ok">인증 완료</span></div>
<div class="verified"><span>보험 인증</span><span class="ok">인증 완료</span></div>
</div>
<div class="section">비고</div><div class="card"><div class="input" style="height:72px;align-items:flex-start;padding-top:11px;color:var(--text2)">공항 픽업 및 대형 수하물 운행 가능</div></div>
<div class="notice">차량번호나 인증정보가 변경되면 관리자 확인 후 반영됩니다.</div>
<div class="btn">변경사항 저장</div><div class="btn outline">취소</div>
</div></body></html>
